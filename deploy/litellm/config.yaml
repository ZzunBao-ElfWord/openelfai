  - model_name: cohere/command-r
    litellm_params:
      model: cohere/command-r-08-2024
      api_key: os.environ/COHERE_API_KEY

litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: null
  store_model_in_db: false
