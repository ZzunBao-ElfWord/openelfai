# OpenElf Flutter Web 应用 - web.openelfai.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name web.openelfai.com;

    ssl_certificate     /etc/letsencrypt/live/web.openelfai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web.openelfai.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/openelf-webapp;
    index index.html;

    # 系统 mime.types 缺 wasm 类型。不要在 server 级写 types 块：那会整体替换
    # 继承的映射，index.html 会被当成 octet-stream 下发（浏览器直接下载而不渲染）。
    # 只在需要的 location 内单独声明，其余路径沿用 mime.types。

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    # 优先下发部署时预压缩好的 .gz，省掉每次请求的压缩 CPU
    gzip_static on;

    # 入口与 Service Worker 不缓存，保证发版即生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        default_type "application/javascript";
    }
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /version.json {
        add_header Cache-Control "no-cache";
    }

    # 主包每次发版都会变：走协商缓存，命中 304 只花几十毫秒
    location = /main.dart.js {
        add_header Cache-Control "no-cache";
    }

    # CanvasKit 引擎（5MB wasm）：随引擎固定，静态 gzip 后约 2MB，缓存一周
    # 该目录只有 wasm/js，可安全地在本 location 内重建类型表并补 wasm
    location ^~ /canvaskit/ {
        types {
            application/wasm wasm;
            application/javascript js;
            text/plain symbols;
        }
        default_type application/octet-stream;
        gzip_static on;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location ~ \.wasm$ {
        default_type application/wasm;
        gzip_static on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name web.openelfai.com;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/openelf;
    }

    location / {
        return 301 https://web.openelfai.com$request_uri;
    }
}
