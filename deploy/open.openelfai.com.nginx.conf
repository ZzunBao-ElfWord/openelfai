# OpenElf 开放平台站 - open.openelfai.com
# 独立站点：部署目录 /var/www/openelf-open（由 NEXT_PUBLIC_SITE_VARIANT=open 单独构建），
# 只提供开放平台相关内容，官网其余页面统一 301 回主站。
server {
    listen 80;
    listen [::]:80;
    server_name open.openelfai.com;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/openelf-open;
    }

    location / {
        return 301 https://open.openelfai.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name open.openelfai.com;

    ssl_certificate     /etc/letsencrypt/live/open.openelfai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/open.openelfai.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control "no-cache" always;

    root /var/www/openelf-open;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml application/rss+xml;

    location ^~ /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ^~ /logos/ {
        expires 7d;
        try_files $uri =404;
    }

    location ~ ^/(favicon\.ico|icon\.png|apple-icon\.png|logo\.png)$ {
        try_files $uri =404;
    }

    # Next.js 静态导出的根级产物：客户端路由（Link 跳转）会拉取 /index.txt 等预渲染载荷，
    # 缺失时同域内跳转会失败（表现为点「首页」无反应）
    location ~ ^/(index|404)\.(txt|html)$ {
        try_files $uri =404;
    }

    location ~ ^/(robots\.txt|sitemap\.xml|llms\.txt)$ {
        try_files $uri =404;
    }

    # 门户首页
    location = / {
        try_files /index.html =404;
    }

    # 开放平台自有页面
    location ^~ /platform/ {
        try_files $uri $uri/ =404;
    }

    location ^~ /developers/ {
        try_files $uri $uri/ =404;
    }

    location ^~ /docs/ {
        try_files $uri $uri/ =404;
    }

    location ^~ /console/ {
        try_files $uri $uri/ =404;
    }

    location = /404.html {
        internal;
        try_files $uri =404;
    }

    error_page 404 /404.html;

    # 官网内容不在本域名提供，回主站
    location / {
        return 301 https://openelfai.com$request_uri;
    }
}
