name: openelf_ali_captcha
description: OpenElf bridge for Alibaba Cloud PNVS graphical authentication.
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: cn.openelfai.captcha
        pluginClass: OpenElfAliCaptchaPlugin
      ios:
        pluginClass: OpenElfAliCaptchaPlugin
