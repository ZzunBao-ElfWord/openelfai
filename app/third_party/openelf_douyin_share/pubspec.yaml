name: openelf_douyin_share
description: User-initiated OpenElf image sharing through the official Douyin SDK.
version: 1.0.0
publish_to: none
environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: cn.openelfai.sharing
        pluginClass: OpenElfDouyinSharePlugin
      ios:
        pluginClass: OpenElfDouyinSharePlugin
