name: openelf_kwai_share
description: User initiated image editing handoff through the official Kwai SDK.
version: 1.0.0
publish_to: none
environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: cn.openelfai.kwai
        pluginClass: OpenElfKwaiSharePlugin
      ios:
        pluginClass: OpenElfKwaiSharePlugin
