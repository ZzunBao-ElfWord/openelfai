name: openelf
description: OpenElf - 持有制 AI 社区
publish_to: 'none'
version: 1.0.5+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  in_app_purchase: ^3.3.1
  in_app_purchase_storekit: ^0.4.15
  video_player: ^2.9.2
  audioplayers: ^6.1.0
  share_plus: ^10.1.4
  app_links: ^6.3.2
  image_picker: ^1.2.3
  jpush_flutter: 3.5.9
  openelf_ali_captcha:
    path: third_party/openelf_ali_captcha
  openelf_douyin_share:
    path: third_party/openelf_douyin_share
  openelf_wechat_share:
    path: third_party/openelf_wechat_share
  openelf_kwai_share:
    path: third_party/openelf_kwai_share

dev_dependencies:
  share_plus_platform_interface: ^5.0.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
