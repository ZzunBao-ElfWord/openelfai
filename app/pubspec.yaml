name: openelf
description: OpenElf - 持有制 AI 社区
publish_to: 'none'
# Preserve the user's release baseline; merging does not issue a new package.
version: 1.0.4+22

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  in_app_purchase: ^3.3.1
  in_app_purchase_storekit: ^0.4.15
  video_player: ^2.9.2
  audioplayers: ^6.1.0
  share_plus: ^10.1.4
  app_links: ^6.3.2
  image_picker: ^1.2.3
  jpush_flutter: 3.5.9
  openelf_ali_captcha:
    path: third_party/openelf_ali_captcha
  openelf_douyin_share:
    path: third_party/openelf_douyin_share
  openelf_wechat_share:
    path: third_party/openelf_wechat_share
  openelf_kwai_share:
    path: third_party/openelf_kwai_share

dependency_overrides:
  # shared_preferences_android / path_provider_android 新版引入 jni 原生构建，
  # 本机 NDK 下会报「Expected output file libdartjni.so」，回退到不含 jni 的版本。
  shared_preferences_android: 2.4.28
  path_provider_android: 2.2.23

dev_dependencies:
  share_plus_platform_interface: ^5.0.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/styles/
    - assets/pet/
