# OpenElf 管理后台 BFF - admin.openelfai.com
# 线上实况（certbot --nginx 生成后回收同步）：
#   443 反代 http://127.0.0.1:8094；80 301 跳转；ACME 走 443 块的 webroot /var/www/openelf
# 证书：certbot --nginx -d admin.openelfai.com --redirect
# 续期钩子：/etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh

server {
    server_name admin.openelfai.com;
    # 运营素材上传（官方 AI 形象 / 栏目封面），BFF 侧限制单文件 5MB
    client_max_body_size 8m;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/openelf;
    }

    location / {
        proxy_pass http://127.0.0.1:8094;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/admin.openelfai.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/admin.openelfai.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = admin.openelfai.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name admin.openelfai.com;
    return 404; # managed by Certbot
}
