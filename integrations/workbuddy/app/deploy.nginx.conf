# apps.openelfai.com —— WorkBuddy Buddy 应用（形象工坊 H5）
# 静态根与 integrations/workbuddy/app 目录保持一致；/mcp 与形象图片走本机服务反代。
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name apps.openelfai.com;

    ssl_certificate     /etc/letsencrypt/live/apps.openelfai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apps.openelfai.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 1m;

    root /var/www/openelf-workbuddy/app;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 入口不缓存，保证发版即生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # MCP 端点：streamableHttp，长连接不缓冲
    location /mcp {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        chunked_transfer_encoding on;
    }

    # 形象图片：内容按哈希命名，可长缓存
    location /api/v1/character-assets/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 其余静态资源：短缓存，允许直接刷新
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=600";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name apps.openelfai.com;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/openelf;
    }

    location / {
        return 301 https://apps.openelfai.com$request_uri;
    }
}
