<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0b1220">
<title>OpenElf 形象工坊</title>
<style>
  :root {
    --bg: #f4f7fc;
    --bg2: #e9eff9;
    --panel: #ffffff;
    --text: #101a2c;
    --muted: #5c6b83;
    --line: #dbe4f1;
    --line-strong: #c3d1e5;
    --accent: #2563eb;
    --accent-2: #3b82f6;
    --accent-soft: #e8f0ff;
    --ok: #0f766e;
    --err: #b42318;
    --foot: rgba(244, 247, 252, 0.86);
    --shadow: 0 10px 30px rgba(23, 43, 84, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #080e1a;
      --bg2: #0e1728;
      --panel: #111b2d;
      --text: #e7eefb;
      --muted: #94a5bf;
      --line: #22304a;
      --line-strong: #33466a;
      --accent: #60a5fa;
      --accent-2: #3b82f6;
      --accent-soft: #16284a;
      --ok: #5eead4;
      --err: #fca5a5;
      --foot: rgba(8, 14, 26, 0.86);
      --shadow: 0 14px 40px rgba(0, 0, 0, 0.42);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    padding-bottom: 74px;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    background:
      radial-gradient(1200px 520px at 12% -18%, rgba(59, 130, 246, 0.18), transparent 68%),
      radial-gradient(900px 480px at 96% 0%, rgba(96, 165, 250, 0.14), transparent 62%),
      linear-gradient(180deg, var(--bg), var(--bg2));
    background-attachment: fixed;
  }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px 24px;
    justify-content: space-between;
    padding: 14px clamp(16px, 4vw, 40px);
    border-bottom: 1px solid var(--line);
    background: var(--foot);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .logo {
    width: 42px;
    height: 42px;
    flex: none;
    border-radius: 12px;
    background: linear-gradient(140deg, #3b82f6, #1d4ed8);
    box-shadow: 0 8px 20px rgba(37, 99, 235, 0.28);
  }
  .brand h1 { margin: 0; font-size: 17px; letter-spacing: 0.02em; font-weight: 700; }
  .brand p { margin: 3px 0 0; font-size: 12px; color: var(--muted); }
  .auth { display: flex; flex-direction: column; gap: 6px; min-width: min(360px, 100%); flex: 1; max-width: 420px; }
  .auth label { font-size: 12px; font-weight: 600; color: var(--muted); }
  .keyrow { display: flex; align-items: center; gap: 8px; }
  .keyrow input {
    flex: 1;
    min-width: 0;
    height: 40px;
    padding: 0 12px;
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    background: var(--panel);
    color: var(--text);
    font-size: 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    outline: none;
  }
  .keyrow input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .pill {
    flex: none;
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    font-size: 12px;
    color: var(--muted);
    background: var(--panel);
    white-space: nowrap;
  }
  .pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); background: color-mix(in srgb, var(--ok) 10%, transparent); }
  .keynote { margin: 0; font-size: 11px; color: var(--muted); }
  main {
    width: min(980px, 100%);
    margin: 0 auto;
    padding: 22px clamp(16px, 4vw, 40px) 32px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: clamp(16px, 3vw, 24px);
    box-shadow: var(--shadow);
  }
  .panel-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .step {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(140deg, var(--accent-2), var(--accent));
    flex: none;
  }
  .panel-head h2 { margin: 0; font-size: 15px; font-weight: 700; }
  .panel-head .sub { margin: 0; font-size: 12px; color: var(--muted); }
  .styles {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }
  .style {
    text-align: left;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: border-color 0.16s ease, background 0.16s ease, transform 0.16s ease;
  }
  .style strong { display: block; font-size: 14px; }
  .style span { display: block; margin-top: 3px; font-size: 11px; color: var(--muted); line-height: 1.4; }
  .style:hover { transform: translateY(-1px); border-color: var(--line-strong); }
  .style.active { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent) inset; }
  .style.active span { color: var(--accent); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row .grow { flex: 1; min-width: 180px; }
  .btn {
    appearance: none;
    border: 1px solid transparent;
    border-radius: 12px;
    padding: 11px 20px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.16s ease, box-shadow 0.16s ease, opacity 0.16s ease;
  }
  .btn.primary {
    color: #fff;
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    box-shadow: 0 8px 20px rgba(37, 99, 235, 0.24);
  }
  .btn.ghost { color: var(--text); background: transparent; border-color: var(--line-strong); }
  .btn:hover:not(:disabled) { transform: translateY(-1px); }
  .btn:disabled { opacity: 0.42; cursor: not-allowed; box-shadow: none; transform: none; }
  .btn:focus-visible, .style:focus-visible, .tile:focus-visible, input:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .nameinput {
    height: 42px;
    padding: 0 12px;
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    background: var(--panel);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }
  .nameinput:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
    min-height: 112px;
  }
  .empty {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 112px;
    border: 1px dashed var(--line-strong);
    border-radius: 12px;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 16px;
  }
  .tile {
    position: relative;
    aspect-ratio: 1 / 1;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    background: var(--accent-soft);
    cursor: pointer;
    transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
  }
  .tile img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .tile:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .tile.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .tile .tag {
    position: absolute;
    left: 6px;
    bottom: 6px;
    padding: 2px 7px;
    border-radius: 999px;
    background: rgba(8, 14, 26, 0.62);
    color: #eaf2ff;
    font-size: 10px;
    letter-spacing: 0.03em;
    backdrop-filter: blur(4px);
  }
  .tile .check {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: #fff;
    background: var(--accent);
  }
  .tile.selected .check { display: flex; }
  .meta { margin: 12px 0 0; font-size: 12px; color: var(--muted); min-height: 18px; }
  .meta strong { color: var(--text); }
  .result { margin-top: 14px; display: none; }
  .result.show { display: block; animation: rise 0.26s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .figure {
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    background: #0a1220;
    display: flex;
    justify-content: center;
  }
  .figure img { display: block; width: 100%; max-width: 560px; height: auto; }
  .figure-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .figure-foot p { margin: 0; font-size: 12px; color: var(--muted); }
  .download {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 16px;
    border-radius: 10px;
    border: 1px solid var(--line-strong);
    color: var(--text);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    transition: border-color 0.16s ease, transform 0.16s ease;
  }
  .download:hover { border-color: var(--accent); transform: translateY(-1px); }
  .status {
    position: fixed;
    left: 50%;
    bottom: 64px;
    transform: translate(-50%, 14px);
    max-width: min(92vw, 520px);
    padding: 10px 16px;
    border-radius: 12px;
    border: 1px solid var(--line-strong);
    background: var(--panel);
    box-shadow: var(--shadow);
    font-size: 13px;
    line-height: 1.5;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease, transform 0.18s ease;
    z-index: 30;
    text-align: center;
  }
  .status.show { opacity: 1; transform: translate(-50%, 0); }
  .status.err { color: var(--err); border-color: color-mix(in srgb, var(--err) 50%, transparent); }
  .status.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 50%, transparent); }
  footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 20;
    padding: 11px 16px calc(11px + env(safe-area-inset-bottom));
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    background: var(--foot);
    border-top: 1px solid var(--line);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  body.busy .btn:not(:disabled) { opacity: 0.55; }
  @media (max-width: 720px) {
    .topbar { align-items: flex-start; }
    .auth { min-width: 100%; max-width: none; }
    .styles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid { grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); }
    .row .btn { flex: 1 1 auto; }
  }
  @media (max-width: 420px) {
    .brand p { display: none; }
    .panel-head .sub { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 20 L8 14 L11 23 Z"/>
        <path d="M34 20 L40 14 L37 23 Z"/>
        <circle cx="24" cy="21" r="8.6"/>
        <path d="M18.6 21 H29.4"/>
        <path d="M14 42 C14 34 18.4 30 24 30 C29.6 30 34 34 34 42"/>
      </svg>
      <div class="brandtext">
        <h1>OpenElf 形象工坊</h1>
        <p>一句话，一只 AI 形象</p>
      </div>
    </div>
    <div class="auth">
      <label for="apiKey">OpenElf API Key</label>
      <div class="keyrow">
        <input id="apiKey" type="password" autocomplete="off" spellcheck="false" autocapitalize="off" placeholder="oe-sk-xxxxxxxxxxxxxxxx" aria-describedby="keyNote">
        <span id="keyState" class="pill">未填写</span>
      </div>
      <p id="keyNote" class="keynote">密钥仅保存在当前浏览器会话，不会上传到第三方。</p>
    </div>
  </header>

  <main>
    <section class="panel" aria-labelledby="step1">
      <div class="panel-head">
        <span class="step">1</span>
        <h2 id="step1">选择风格</h2>
        <p class="sub">先定整体气质，再让配件自由组合</p>
      </div>
      <div id="styles" class="styles" role="radiogroup" aria-label="形象风格"></div>
      <div class="row">
        <button id="previewBtn" class="btn primary" type="button" disabled>随机生成预览</button>
        <span id="previewHint" class="meta" style="margin:0">填写 API Key 后即可开始</span>
      </div>
    </section>

    <section class="panel" aria-labelledby="step2">
      <div class="panel-head">
        <span class="step">2</span>
        <h2 id="step2">挑选预览并保存角色卡</h2>
        <p class="sub">预览免费，点击缩略图即可选中</p>
      </div>
      <div id="grid" class="grid" aria-live="polite"></div>
      <div class="row">
        <input id="nameInput" class="nameinput grow" maxlength="64" placeholder="角色名（必填，最多 64 字）" aria-label="角色名">
        <button id="saveBtn" class="btn ghost" type="button" disabled>保存为角色卡</button>
      </div>
      <p id="cardInfo" class="meta"></p>
    </section>

    <section class="panel" aria-labelledby="step3">
      <div class="panel-head">
        <span class="step">3</span>
        <h2 id="step3">生成正式形象</h2>
        <p class="sub">按实际用量计费，失败不产生费用</p>
      </div>
      <div class="row">
        <button id="genBtn" class="btn primary" type="button" disabled>生成正式形象</button>
        <span class="meta" style="margin:0">生成后可下载 PNG 大图</span>
      </div>
      <div id="result" class="result"></div>
    </section>
  </main>

  <div id="status" class="status" role="status" aria-live="polite"></div>
  <footer>内容由 AI 生成 · OpenElf</footer>

<script>
(function () {
  'use strict';

  var STYLES = [
    { id: 'general', label: '通用', desc: '干净平衡，适合大多数场景' },
    { id: 'pixel', label: '像素画', desc: '网格色块与复古质感' },
    { id: 'romance', label: '言情漫画', desc: '柔和线条与明亮配色' },
    { id: 'painterly', label: '细腻厚涂', desc: '强调光影与笔触层次' }
  ];
  var RARITY = { common: '常见', rare: '稀有', epic: '史诗', legendary: '传说' };
  var SESSION_KEY = 'openelf_api_key';
  var MAX_PREVIEWS = 9;

  var state = {
    key: '',
    style: 'general',
    previews: [],
    selected: -1,
    card: null,
    busy: false
  };

  var rpcId = 0;
  var toastTimer = null;

  var els = {
    apiKey: document.getElementById('apiKey'),
    keyState: document.getElementById('keyState'),
    styles: document.getElementById('styles'),
    previewBtn: document.getElementById('previewBtn'),
    previewHint: document.getElementById('previewHint'),
    grid: document.getElementById('grid'),
    nameInput: document.getElementById('nameInput'),
    saveBtn: document.getElementById('saveBtn'),
    cardInfo: document.getElementById('cardInfo'),
    genBtn: document.getElementById('genBtn'),
    result: document.getElementById('result'),
    status: document.getElementById('status')
  };

  function makeError(code, message) {
    var error = new Error(message);
    error.code = code;
    return error;
  }

  function notify(message, kind) {
    els.status.textContent = message;
    els.status.className = 'status show' + (kind ? ' ' + kind : '');
    if (toastTimer) clearTimeout(toastTimer);
    if (kind !== 'err') {
      toastTimer = setTimeout(function () {
        els.status.className = 'status';
      }, 3200);
    }
  }

  function styleLabel(id) {
    for (var i = 0; i < STYLES.length; i += 1) {
      if (STYLES[i].id === id) return STYLES[i].label;
    }
    return '通用';
  }

  function currentPreview() {
    return state.selected >= 0 ? state.previews[state.selected] : null;
  }

  function syncGate() {
    var hasKey = !!state.key;
    var busy = state.busy;
    els.previewBtn.disabled = !hasKey || busy;
    els.saveBtn.disabled = !hasKey || busy || state.selected < 0;
    els.genBtn.disabled = !hasKey || busy || !state.card;
    els.keyState.textContent = hasKey ? '已填写' : '未填写';
    els.keyState.className = 'pill' + (hasKey ? ' ok' : '');
    els.previewHint.textContent = hasKey ? '预览不产生费用，可反复重掷' : '填写 API Key 后即可开始';
    document.body.classList.toggle('busy', busy);
  }

  function setBusy(value, message) {
    state.busy = value;
    if (message) notify(message, '');
    syncGate();
  }

  function renderStyles() {
    els.styles.textContent = '';
    STYLES.forEach(function (item) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'style' + (item.id === state.style ? ' active' : '');
      btn.setAttribute('role', 'radio');
      btn.setAttribute('aria-checked', item.id === state.style ? 'true' : 'false');
      var strong = document.createElement('strong');
      strong.textContent = item.label;
      var span = document.createElement('span');
      span.textContent = item.desc;
      btn.appendChild(strong);
      btn.appendChild(span);
      btn.addEventListener('click', function () {
        if (state.busy || state.style === item.id) return;
        state.style = item.id;
        renderStyles();
      });
      els.styles.appendChild(btn);
    });
  }

  function renderResult(item, imageUrl, card) {
    els.result.textContent = '';
    var figure = document.createElement('div');
    figure.className = 'figure';
    var img = document.createElement('img');
    img.src = imageUrl;
    img.alt = (card && card.name ? card.name : 'AI 形象') + ' 的正式形象';
    img.loading = 'lazy';
    figure.appendChild(img);

    var foot = document.createElement('div');
    foot.className = 'figure-foot';
    var note = document.createElement('p');
    var rarity = (card && card.rarity_tier) || (item && item.rarity && item.rarity.tier);
    note.textContent = '内容由 AI 生成 · 请勿用于侵害他人权益的场景' + (RARITY[rarity] ? ' · ' + RARITY[rarity] : '');
    var link = document.createElement('a');
    link.className = 'download';
    link.href = imageUrl;
    link.download = ((card && card.name) || 'openelf-character').replace(/[\\/:*?"<>|]/g, '_') + '.png';
    link.textContent = '下载 PNG';
    foot.appendChild(note);
    foot.appendChild(link);

    els.result.appendChild(figure);
    els.result.appendChild(foot);
    els.result.className = 'result show';
  }

  function clearResult() {
    els.result.textContent = '';
    els.result.className = 'result';
  }

  function renderGrid() {
    els.grid.textContent = '';
    if (!state.previews.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '还没有预览。选择风格后点击「随机生成预览」，可连续多试几版。';
      els.grid.appendChild(empty);
      return;
    }
    state.previews.forEach(function (item, index) {
      var tile = document.createElement('button');
      tile.type = 'button';
      tile.className = 'tile' + (index === state.selected ? ' selected' : '');
      tile.setAttribute('aria-label', '预览 ' + (index + 1) + '，种子 ' + item.seed);
      tile.setAttribute('aria-pressed', index === state.selected ? 'true' : 'false');
      var img = document.createElement('img');
      img.src = item.thumb;
      img.alt = 'AI 形象预览 ' + (index + 1);
      img.loading = 'lazy';
      var tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = RARITY[item.rarity && item.rarity.tier] || '预览';
      var check = document.createElement('span');
      check.className = 'check';
      check.textContent = '✓';
      tile.appendChild(img);
      tile.appendChild(tag);
      tile.appendChild(check);
      tile.addEventListener('click', function () {
        if (state.busy || state.selected === index) return;
        state.selected = index;
        state.card = null;
        els.cardInfo.textContent = '';
        clearResult();
        renderGrid();
        syncGate();
      });
      els.grid.appendChild(tile);
    });
  }

  function parsePayload(text) {
    if (!text) return null;
    try {
      return JSON.parse(text);
    } catch (err) {
      return null;
    }
  }

  function parseEventStream(text) {
    var last = null;
    text.split(/\r?\n/).forEach(function (line) {
      var trimmed = line.trim();
      if (trimmed.indexOf('data:') !== 0) return;
      var chunk = trimmed.slice(5).trim();
      if (!chunk || chunk === '[DONE]') return;
      var parsed = parsePayload(chunk);
      if (parsed && (parsed.result !== undefined || parsed.error !== undefined)) last = parsed;
    });
    return last;
  }

  function textContentOf(result) {
    if (!result || !Array.isArray(result.content)) return '';
    return result.content
      .filter(function (part) { return part && part.type === 'text' && typeof part.text === 'string'; })
      .map(function (part) { return part.text; })
      .join('\n')
      .trim();
  }

  function unwrap(result) {
    if (result && result.structuredContent && typeof result.structuredContent === 'object') {
      return result.structuredContent;
    }
    var text = textContentOf(result);
    if (!text) return result || {};
    var parsed = parsePayload(text);
    return parsed === null ? { message: text } : parsed;
  }

  async function mcpCall(name, args) {
    if (!state.key) throw makeError('UNAUTHORIZED', '请先填写 OpenElf API Key');
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, 90000);
    var response;
    try {
      response = await fetch('/mcp', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'accept': 'application/json, text/event-stream',
          'authorization': 'Bearer ' + state.key
        },
        body: JSON.stringify({
          jsonrpc: '2.0',
          id: ++rpcId,
          method: 'tools/call',
          params: { name: name, arguments: args }
        }),
        signal: controller.signal
      });
    } catch (err) {
      if (err && err.name === 'AbortError') throw makeError('TIMEOUT', '请求超时，请稍后重试');
      throw makeError('NETWORK', '网络请求失败，请检查连接后重试');
    } finally {
      clearTimeout(timer);
    }

    if (response.status === 401 || response.status === 403) {
      throw makeError('UNAUTHORIZED', 'API Key 无效或已失效，请重新填写');
    }
    if (response.status === 402) {
      throw makeError('INSUFFICIENT_BALANCE', '账户余额不足，请充值后重试');
    }
    if (response.status === 429) {
      throw makeError('RATE_LIMITED', '调用过于频繁，请稍后再试');
    }

    var type = response.headers.get('content-type') || '';
    var raw = await response.text();
    var payload = type.indexOf('text/event-stream') >= 0 ? parseEventStream(raw) : parsePayload(raw);
    if (!payload) throw makeError('BAD_RESPONSE', '服务返回异常（HTTP ' + response.status + '）');
    if (payload.error) {
      var errorPayload = payload.error;
      throw makeError(errorPayload.code || 'RPC_ERROR', errorPayload.message || '调用失败');
    }
    var result = payload.result || {};
    if (result.isError) {
      throw makeError('TOOL_ERROR', textContentOf(result) || '工具返回错误');
    }
    var data = unwrap(result);
    if (data && data.ok === false) {
      throw makeError(data.code || 'TOOL_ERROR', data.message || '调用失败');
    }
    return data;
  }

  function friendly(err) {
    if (!err) return '操作失败，请重试';
    if (err.code === 'UNAUTHORIZED') return 'API Key 无效或已失效，请到 OpenElf 开放平台控制台检查后重新填写。';
    if (err.code === 'INSUFFICIENT_BALANCE' || err.code === 'QUOTA_EXCEEDED') return '账户余额或额度不足，请充值后重试。';
    if (err.code === 'INVALID_COUNT' || err.code === 'COUNT_EXCEEDS_LIMIT') return '数量超出上限（单次最多 10 个）。';
    if (err.code === 'TIMEOUT' || err.code === 'NETWORK') return err.message;
    return err.message || '操作失败，请重试';
  }

  async function onPreview() {
    if (!state.key || state.busy) return;
    setBusy(true, '正在组合配件并渲染预览…');
    try {
      var seed = Math.floor(Math.random() * 0x7fffffff);
      var data = await mcpCall('generate_preview', { style: state.style, seed: seed });
      var thumb = data.thumbDataUrl || data.thumbUrl || data.imageUrl;
      if (!thumb) throw makeError('BAD_RESPONSE', '预览没有返回图片');
      state.previews.unshift({
        thumb: thumb,
        traits: data.traits || {},
        rarity: data.rarity || null,
        compositionHash: data.compositionHash || '',
        seed: typeof data.seed === 'number' ? data.seed : seed,
        style: state.style
      });
      if (state.previews.length > MAX_PREVIEWS) state.previews.length = MAX_PREVIEWS;
      state.selected = 0;
      state.card = null;
      els.cardInfo.textContent = '';
      clearResult();
      renderGrid();
      notify('预览已生成，可继续重掷或选中保存。', 'ok');
    } catch (err) {
      notify(friendly(err), 'err');
    } finally {
      setBusy(false);
    }
  }

  async function onSave() {
    var item = currentPreview();
    if (!item || !state.key || state.busy) return;
    var name = els.nameInput.value.trim() || 'AI 形象 ' + new Date().toLocaleDateString('zh-CN');
    setBusy(true, '正在保存角色卡…');
    try {
      var data = await mcpCall('create_character', {
        name: name,
        style: item.style,
        prompt: '风格：' + styleLabel(item.style) + '；由预览组合确认。',
        traits: item.traits,
        seed: item.seed
      });
      var card = data.card || data;
      if (!card || !card.id) throw makeError('BAD_RESPONSE', '没有返回角色卡编号');
      state.card = card;
      els.nameInput.value = card.name || name;
      els.cardInfo.textContent = '';
      var strong = document.createElement('strong');
      strong.textContent = card.name || name;
      els.cardInfo.appendChild(document.createTextNode('角色卡已保存 · '));
      els.cardInfo.appendChild(strong);
      els.cardInfo.appendChild(document.createTextNode(' · 编号 ' + String(card.id).slice(0, 8)));
      notify('角色卡已保存，可以生成正式形象了。', 'ok');
    } catch (err) {
      notify(friendly(err), 'err');
    } finally {
      setBusy(false);
    }
  }

  function imageUrlOf(data) {
    if (data && data.imageUrl) return data.imageUrl;
    if (data && data.card && data.card.imageUrl) return data.card.imageUrl;
    var key = (data && data.image_key) || (data && data.card && data.card.image_key);
    if (key) return '/api/v1/character-assets/' + key;
    return null;
  }

  async function onGenerate() {
    var item = currentPreview();
    if (!item || !state.card || !state.key || state.busy) return;
    setBusy(true, '正在生成正式形象，可能需要一点时间…');
    try {
      var data = await mcpCall('generate_character', {
        character_id: state.card.id,
        traits: item.traits,
        seed: item.seed
      });
      var url = imageUrlOf(data);
      if (!url) throw makeError('BAD_RESPONSE', '没有返回形象图片');
      if (data.card) state.card = data.card;
      renderResult(item, url, data.card || state.card);
      notify('正式形象已生成。', 'ok');
    } catch (err) {
      notify(friendly(err), 'err');
    } finally {
      setBusy(false);
    }
  }

  function restoreKey() {
    var saved = '';
    try { saved = sessionStorage.getItem(SESSION_KEY) || ''; } catch (err) { saved = ''; }
    state.key = saved.trim();
    els.apiKey.value = state.key;
  }

  els.apiKey.addEventListener('input', function (event) {
    state.key = event.target.value.trim();
    try {
      if (state.key) sessionStorage.setItem(SESSION_KEY, state.key);
      else sessionStorage.removeItem(SESSION_KEY);
    } catch (err) { /* 隐私模式下忽略存储失败 */ }
    syncGate();
  });
  els.previewBtn.addEventListener('click', onPreview);
  els.saveBtn.addEventListener('click', onSave);
  els.genBtn.addEventListener('click', onGenerate);

  restoreKey();
  renderStyles();
  renderGrid();
  syncGate();
})();
</script>
</body>
</html>
